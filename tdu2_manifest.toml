# Generated by ReXGlue v0.10.0.24-dev.gbd833a2, then hand-edited.
# See README.md for the two-image layout (Default.xex stub + TestDrive2_DLL.xex).

[project]
name = "tdu2"
sdk_version = "0.10.0"
game_root = "TDU2"

[entrypoint]
file_path = "TDU2/Default.xex"
out_directory_path = "generated/default"
includes = []

# 0x82022BFC is branched to from 0x82022C4C but was not discovered as a
# function entry (it sits in a region the scanner treats as non-code).
# Declaring it explicitly here satisfies the unresolved-call check and
# emits the body, which is how the routine was identified.
[entrypoint.functions."0x82022BFC"]
name = "sub_82022BFC"

# --- Guest DLL module -------------------------------------------------------
# Default.xex is only the launcher stub (its code section is just
# 0x82010000-0x8203A3BC); the game proper lives in TestDrive2_DLL.xex, which
# the stub loads at runtime via XexLoadImage. Without this module the first
# call into DLL code fatals with "function not in function table".
# guest_path must match the string the guest passes to XexLoadImage.
[[modules]]
name = "TestDrive2_DLL"
file_path = "TDU2/TestDrive2_DLL.xex"
out_directory_path = "generated/TestDrive2_DLL"
guest_path = "TestDrive2_DLL.xex"

# Same story as 0x82022BFC in the entrypoint: branch targets the scanner
# classified as non-code. Both are pinned so validation passes and their
# bodies get emitted for inspection.
[modules.functions."0x8852BB60"]
name = "sub_8852BB60"

[modules.functions."0x8824F0C0"]
name = "sub_8824F0C0"

# 0x88612F18 sits in a 12-byte hole in the registered function table
