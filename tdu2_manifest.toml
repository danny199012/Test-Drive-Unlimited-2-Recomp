# address 0x88612F18" -> abort(). It is the instruction right after the
# final `bl 0x886CC180` in sub_88612EE8, so it looks like a real (tiny)
# entry that the scanner missed.
[modules.functions."0x88612F18"]
name = "sub_88612F18"

